name: research
start: classify

# Research a topic into a sourced, standard-shape Markdown report.
# The model reasons (classify, synthesize); actions do IO. Evidence gathering is
# deterministic and local-first: the RAG knowledge base takes precedence, and
# only on an empty result does it fall through to Wikipedia → arXiv → web.

nodes:
  classify:
    role: >
      You are a research triage analyst. Given the initial request, define the
      precise research topic and choose a depth tier: quick (~500-1000 words,
      the default), background (~1500-3000), or deep (3000+). Return JSON only.
    prompt: "Initial research request:\n{initial_prompt}"
    schema: classify_out
    verifier: topic_present
    updater: store_topic
    next:
      gather: "Gather evidence: local knowledge base first, then the web."

  gather:
    kind: action
    action: gather_evidence
    schema: gather_out
    verifier: nonempty_findings
    updater: append_findings
    retries: 1
    next:
      synthesize: "Hand collected findings to synthesis."

  synthesize:
    role: >
      You are a synthesis analyst. Combine the findings into a standard-format
      report: a title, a ~60-100 word summary, H2 body sections (one per
      sub-topic), and open questions. Every claim in the body carries an inline
      [key] citation whose key matches a finding. Do not introduce claims the
      findings do not support. Rate confidence High/Medium/Low. Return JSON only.
    prompt: >
      Research topic: {topic}

      Depth: {depth}


      Findings (each carries a citation `key` — cite them inline as [key]):

      {data}
    schema: synthesize_out
    updater: store_report
    reads: [topic, depth, findings]
    skills:
      - ./skills/synthesis.md
    next:
      report: "Write the final report."

  report:
    kind: action
    action: write_report
    schema: report_out
    verifier: markdown_path
    next:
      done: "Finish the workflow."

  done:
    terminal: true
